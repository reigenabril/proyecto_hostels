# Hostel Analytics Pipeline - Data Engineering Project
# Ejecutar: docker compose up -d --build
# Los DAGs van en ./dags — los CSVs se leen desde Google Drive via Airflow.

services:

  # ========== POSTGRES - AIRFLOW METADATA ==========
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hostel-network

  # ========== POSTGRES - DATA WAREHOUSE ==========
  postgres-dwh:
    image: postgres:15-alpine
    container_name: postgres-dwh
    environment:
      POSTGRES_USER: dwh
      POSTGRES_PASSWORD: dwh123
      POSTGRES_DB: dwh
    volumes:
      - postgres_dwh_data:/var/lib/postgresql/data
      - ./init_dwh.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwh"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hostel-network

  # ========== AIRFLOW - INIT DB ==========
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-init
    command: >
      bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true
      "
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__CORE__FERNET_KEY=
      - AIRFLOW__WEBSERVER__SECRET_KEY=hostel-lab-secret-key
      # Credencial de Google Drive: se pasa como variable de entorno, nunca hardcodeada.
      # Crear el archivo credentials.json en ./secrets/ y referenciarlo así:
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/secrets/credentials.json
      - AIRFLOW_CONN_POSTGRES_DWH=postgresql://dwh:dwh123@postgres-dwh:5432/dwh
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./secrets:/opt/airflow/secrets:ro
    depends_on:
      postgres-airflow:
        condition: service_healthy
    networks:
      - hostel-network

  # ========== AIRFLOW - SCHEDULER ==========
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    command: airflow scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__CORE__FERNET_KEY=
      - AIRFLOW__WEBSERVER__SECRET_KEY=hostel-lab-secret-key
      - AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL=30
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/secrets/credentials.json
      - AIRFLOW_CONN_POSTGRES_DWH=postgresql://dwh:dwh123@postgres-dwh:5432/dwh
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./secrets:/opt/airflow/secrets:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
      postgres-dwh:
        condition: service_healthy
    networks:
      - hostel-network

  # ========== AIRFLOW - WEBSERVER ==========
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=True
      - AIRFLOW__CORE__FERNET_KEY=
      - AIRFLOW__WEBSERVER__SECRET_KEY=hostel-lab-secret-key
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/secrets/credentials.json
      - AIRFLOW_CONN_POSTGRES_DWH=postgresql://dwh:dwh123@postgres-dwh:5432/dwh
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./data:/opt/airflow/data
      - ./secrets:/opt/airflow/secrets:ro
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_started
      postgres-airflow:
        condition: service_healthy
    networks:
      - hostel-network

  # ========== METABASE ==========
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase123
      MB_DB_HOST: postgres-metabase
    depends_on:
      postgres-metabase:
        condition: service_healthy
    networks:
      - hostel-network

  postgres-metabase:
    image: postgres:15-alpine
    container_name: postgres-metabase
    environment:
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase123
      POSTGRES_DB: metabase
    volumes:
      - postgres_metabase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hostel-network

networks:
  hostel-network:
    driver: bridge

volumes:
  postgres_airflow_data:
  postgres_dwh_data:
  postgres_metabase_data:
